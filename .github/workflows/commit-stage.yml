name: Commit Stage
on: push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Download Grype
        uses: anchore/scan-action/download-grype@v7
        id: grype
      - name: Refresh Grype vulnerability DB
        run: ${{ steps.grype.outputs.cmd }} db update
      - name: Code vulnerability scanning
        id: scan
        uses: anchore/scan-action@v7
        with:
          path: "${{ github.workspace }}"
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          cache-db: true
      - name: Upload vulnerability report
        if: always() && steps.scan.outputs.sarif != '' && hashFiles('**/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
  package:
    name: Package and Publish
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Generate image version
        id: version
        run: echo "version=$(date -u '+%Y%m%d%H%M%S%N')" >> "$GITHUB_OUTPUT"
      - name: Build container image
        run: |
          chmod +x gradlew
          ./gradlew bootBuildImage \
            --imageName ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
      - name: Download Grype
        uses: anchore/scan-action/download-grype@v7
        id: grype
      - name: Refresh Grype vulnerability DB
        run: ${{ steps.grype.outputs.cmd }} db update
      - name: OCI image vulnerability scanning
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          cache-db: true
      - name: Upload vulnerability report
        if: always() && steps.scan.outputs.sarif != '' && hashFiles('**/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      - name: Log into container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag image as latest
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Publish container image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
